<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seed Planner — mini-gamo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../src/styles/main.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Back link -->
  <a class="back-link" href="../../src/index.html">← mini-gamo</a>

  <!-- Main game wrapper -->
  <main class="game-wrapper">

    <!-- Header -->
    <header class="game-header">
      <h1 class="game-title">🌱 Seed Planner</h1>
      <div class="game-meta">
        <div class="score-display">
          <span class="score-label">Score</span>
          <span class="score-value" id="score-display">0</span>
        </div>
        <div class="turns-display">
          <span class="score-label">Turns</span>
          <span class="score-value" id="turns-display">20</span>
        </div>
      </div>
    </header>

    <!-- Progress bar -->
    <div class="progress-bar-wrap" aria-label="Turns remaining">
      <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="20" aria-valuemin="0" aria-valuemax="20"></div>
    </div>

    <!-- Garden grid -->
    <div class="grid-container" id="grid-container" role="grid" aria-label="Garden grid">
      <!-- 25 cells generated by JS -->
    </div>

    <!-- Score popup container (floats above grid) -->
    <div class="score-popups" id="score-popups" aria-live="polite"></div>

    <!-- Hand of tiles -->
    <section class="hand-section" aria-label="Your crop hand">
      <p class="hand-label">Your crops — tap to select, then tap a cell</p>
      <div class="hand-row" id="hand-row">
        <!-- 4 tiles generated by JS -->
      </div>
    </section>

  </main>

  <!-- Game-over overlay -->
  <div class="overlay" id="game-over-overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-emoji" id="overlay-emoji">🌾</div>
      <h2 class="overlay-title">Season Over!</h2>
      <div class="overlay-stars" id="overlay-stars"></div>
      <div class="overlay-score-block">
        <div class="overlay-score-row">
          <span>Final Score</span>
          <strong id="overlay-score">0</strong>
        </div>
        <div class="overlay-score-row overlay-score-row--hi">
          <span>Best Score</span>
          <strong id="overlay-hi">0</strong>
        </div>
      </div>
      <button class="btn-play-again" id="btn-play-again">Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
